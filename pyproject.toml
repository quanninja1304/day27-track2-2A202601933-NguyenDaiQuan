[project]
name = "data-reliability-game-day"
version = "1.0.0"
description = "Local data reliability game-day lab"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "dbt-core>=1.9,<2",
    "dbt-duckdb>=1.9,<2",
    "duckdb>=1.2,<2",
    "great-expectations==1.21.0",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pytest>=8,<10",
    "pyyaml>=6,<7",
    "streamlit>=1.40,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests_public", "tests"]
addopts = "-q"
